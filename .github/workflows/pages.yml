name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      # v3 pod spodem uzywa upload-artifact@v4; v1 wolalo v3, ktore GitHub
      # wylaczyl — krok konczyl sie "success", ale artefaktu nie bylo i
      # deploy-pages padal z "No artifacts named github-pages".
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # Artefakt jest widoczny w API dopiero po chwili od finalizacji;
      # deploy odpalany w tej samej sekundzie dostawal 0 artefaktow.
      - name: Let the artifact register
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
